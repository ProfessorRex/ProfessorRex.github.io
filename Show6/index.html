  <script>
	 // Declare variables
	let csvData = [];
	let shinyChance = parseInt(document.getElementById('shinyChance').value);
	let evilChance = 10; // 1/evilchance
	let seed = 0;
	
	async function generateNewSeed() {
	  const newSeed = await getRandomWordFromCSV(); // random 8-char seed
	  document.getElementById('seed').value = newSeed;
	  const loaded = await loadCSV();
	  const mega = await loadMega();
	  updateUrlWithInputs();
	  processCSV(loaded, mega); // refresh the randomized output
	}
	 // Generate a random seed string on page load
	window.addEventListener('DOMContentLoaded', () => {
		if (window.location.search) {
			setInputsFromUrl();
		} else {
			generateNewSeed();
		}
		onLoad();
	});
	function clearInputs() {
		document.getElementById("t1hold").value = "";
		document.getElementById("t1hold2").value = "";
		document.getElementById("t1hold3").value = "";
		document.getElementById("t2hold").value = "";
		document.getElementById("t2hold2").value = "";
		document.getElementById("t2hold3").value = "";
		onLoad();
	}
	async function getRandomWordFromCSV() {
	  try {
		const response = await fetch('words.csv');
		const text = await response.text();

		// Split by line and filter out any empty lines
		const words = text.trim().split(',').filter(line => line.length > 0);

		// Pick a random word
		const randomWord = words[Math.floor(Math.random() * words.length)];

		return randomWord;

	  } catch (err) {
		console.error("Failed to load CSV:", err);
		return null;
	}
	}
	async function onLoad(){
	     // Declare variables
		csvData = [];
		shinyChance = parseInt(document.getElementById('shinyChance').value);
		evilChance = 10; // 1/evilchance
		seed = 0;
		const loaded = await loadCSV();
		const mega = await loadMega();
		processCSV(loaded, mega);
		updateUrlWithInputs();
	}
	function getSelectedLeague() {
	  const selected = document.querySelector('input[name="league"]:checked');
	  return selected ? selected.value : null;
	}
	async function loadCSV(){
		var csvData = [];
		var csvName= `${getSelectedLeague()}.csv`;
		await fetch(csvName)
		  .then(response => response.text())
		  .then(text => {
			const parsed = Papa.parse(text.trim(), { header: false });
			csvData = parsed.data.filter(row => row.length > 0).slice(1);
		  });
		 return csvData;
		 
	}
	async function loadMega(){
		var csvData = [];
		var csvName= `${getSelectedLeague()}_mega.csv`;
		await fetch(csvName)
		  .then(response => response.text())
		  .then(text => {
			const parsed = Papa.parse(text.trim(), { header: false });
			csvData = parsed.data.filter(row => row.length > 0);
		  });
		 return csvData;
		 
	}
	
  // Better seeded PRNG using a simple LCG (Linear Congruential Generator)
  function seedRandom(seedStr) {
    for (let i = 0; i < seedStr.length; i++) {
      seed += seedStr.toLowerCase().charCodeAt(i);
    }
    return function () {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }

  function shuffleArray(array, seedStr) {
    let rand = seedRandom(seedStr);
    let arr = array.slice(); // clone the array
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
      // Display CSV line + PvPoke links
    function displayResults(targetId, list) {
      const container = document.getElementById(targetId);
	  const league = getSelectedLeague();
	  var baseUrl = "https://pvpoke.com/rankings/all/1500/overall/";
	  if(league=="ultra"){
		baseUrl = "https://pvpoke.com/rankings/all/2500/overall/";
	  } if(league=="master"){
		baseUrl = "https://pvpoke.com/rankings/all/10000/overall/";
	  }
	  var count = 0;
      const linksHtml = list.map(pkmn => {
	    console.log(pkmn);
		var name = pkmn.split(',')[0]
		const t1 = pkmn.split(',')[3]
		const t2 = pkmn.split(',')[4]
        const url = baseUrl + encodeURIComponent(name.toLowerCase().replace(/ /g, "_").replace(/[()]/g, '')) + "/";
        const isShadow = name.toUpperCase().includes("SHADOW");
		const types = [t1].filter(e => e !== 'none');
		const typeClasses = types.map(t => `type-${t}`).join(' ');;
		var shadow = '<img src="shadowN.png" class="back">';
		var shadowWord = ''
		const showShadow = document.getElementById('noShadow').checked;
		if (name.toUpperCase().endsWith("(SHADOW)")) {
		const restName = name.slice(0,-9); // e.g., "Machamp"
		if(showShadow){
		shadow = '<img src="shadow.gif" class="back">';
		shadowWord = "(Shadow)"
		typeStyled = `<span class="${typeClasses}">${restName}</span> `;
		} else {
		 typeStyled = `<span class="${typeClasses}">${restName}</span>`;
		}
		shadowStyled = `<span class="shadow-link">${shadowWord}</span>`;
		displayName = `${typeStyled}${shadowStyled}`;
		name = restName;
		} else {
		  displayName = `<span class="${typeClasses}">${name}</span>`;
		}
		name = name.replace("Alolan", "Alola").replace("Galarian", "Galar").replace("Unovan", "Unova").replace("Hisuian", "Hisui").replace("'","").replace("Paldean", "Paldea").replace(" (Full Belly)", "").replace("Female",'f').replace(" (Male)","").replace(" (Standard)",'').replace(" (Baile)",'').replace("10% Forme",'10').replace("Complete Forme",'Complete').replace(" (Midday)",'').replace(" (Ordinary)",'').replace(" (Hero)",'').replace("Tauros (",'Tauros (Paldea').replace(" (Average)",'').replace(" (Altered)",'').replace(" (Plant)",'').replace(" (Aria)",'').replace(" (Normal)",'').replace("Crowned Shield",'Crowned').replace("Crowned Sword",'Crowned');
		seedRandom(seed.toString());
		if(seed%evilChance==0){
			displayName = displayName.replace("Shadow", "EVIL");
		}
		seedRandom(seed.toString());
		var shiny = '';
		if(shinyChance!=0 && seed%shinyChance==0){
		var form = "-shiny"
		if(document.getElementById('noShiny').checked){
		shiny = `<span style="font-size: 24px; color: gold;">&#9733;</span> `;
		}
		} else {
		var form = ""
		}
		var beginning = "";
		var end = "";
		if(count==0){
			beginning = "<tr>";
		}
		if(count==2){
			end = "</tr>";
		}
		if(count==3){
			beginning = "<tr>";
		}
		count = count + 1;
		 const showMoves = document.getElementById('showMoves').checked;
		var moves = '';
		if(showMoves && pkmn.split(',').length >= 14){
			moves = `<br>${pkmn.split(',')[11]}<br>${pkmn.split(',')[12]}<br>${pkmn.split(',')[13]}<br>`;
		}
		var imgurl = `https://play.pokemonshowdown.com/sprites/home-centered${form}/${name.replace('-','').replace(' (', '-').replace(/[()]/g, '').toLowerCase().replace('-single strike','').replace('-incarnate','').replace('rapid strike','rapidstrike').replace('-overcast','').replace('-50% forme','').replace('-land','').replace('.','').replace(' ', '')}.png`;
        if(name=="Mewtwo (Armored)"){
			shiny = '';
			imgurl='https://images.gameinfo.io/pokemon/256/p150f85.png';
		}
		return `${beginning}<td><div class="image-stack"><img src="${imgurl}" class="front">${shadow}</div><div><a href="${url}" target="_blank">${shiny}${displayName}</a><font color="white">${moves}</font></div></td>${end}`;
      }).join('');

      container.innerHTML = `${linksHtml}`;
    }

	function getUniqueSpecies(pokemonList, len, megas, t1hold, t2hold) {
	  var uniqueList = [];
	  var seenSpecies = new Set();
	  for (const mega of [...megas, ...t1hold, ...t2hold]){
		if(mega !== undefined){
		  seenSpecies.add(mega.split(",")[0].split(" ")[0]);
	    }
		console.log(seenSpecies);
	  }
	  for (const mon of pokemonList) {
		const species = mon.split(",")[0].split(" ")[0] // first word of name
		if (!seenSpecies.has(species)) {
		  uniqueList.push(mon);
		  seenSpecies.add(species);
		}
		if (uniqueList.length === len) break;
	  }
	  return uniqueList;
	}

    function processCSV(loaded, mega) {
	  seed = 0;
      const seedInput = document.getElementById('seed').value;
	  shinyChance = parseInt(document.getElementById('shinyChance').value);
      const limitMin = parseInt(document.getElementById('rowLimitMin').value);
	  const limitMax = parseInt(document.getElementById('rowLimitMax').value);
	  
      
	  const teamUnique = document.getElementById('uniqueTeamCheckbox').checked;
	  const enforceUnique = document.getElementById('uniqueSpeciesCheckbox').checked;
	  const allowDuplicates = document.getElementById('allowDuplicates').checked;
	  const allowForms = document.getElementById('allowForms').checked;
	  const megas = document.getElementById('megas').checked;
      const subset = loaded.slice(limitMin-1, limitMax);
	  const t1hold = document.getElementById('t1hold').value;
	  const t2hold = document.getElementById('t2hold').value;
	  var t1holdmon = [];
	  var t2holdmon = [];
	  if (t1hold != ''){
		t1holdmon = loaded.find(row => row[0] === t1hold);
		if (t1holdmon !== undefined){
		  t1holdmon = t1holdmon.join(',');
		} else {
		  t1holdmon = `${t1hold}, , , , '`
		}
	  }
	  if (t2hold != ''){
		t2holdmon = loaded.find(row => row[0] === t2hold);
		if (t2holdmon !== undefined){
		  t2holdmon = t2holdmon.join(',');
		} else {
		  t2holdmon = `${t2hold}, , , , `;
		}
	  }
	  const t1hold2 = document.getElementById('t1hold2').value;
	  const t2hold2 = document.getElementById('t2hold2').value;
	  var t1holdmon2 = [];
	  var t2holdmon2 = [];
	  if (t1hold2 != ''){
		t1holdmon2 = loaded.find(row => row[0] === t1hold2);
		if (t1holdmon2 !== undefined){
		  t1holdmon2 = t1holdmon2.join(',');
		} else {
		  t1holdmon2 = `${t1hold2}, , , , '`
		}
	  }
	  if (t2hold2 != ''){
		t2holdmon2 = loaded.find(row => row[0] === t2hold2);
		if (t2holdmon2 !== undefined){
		  t2holdmon2 = t2holdmon2.join(',');
		} else {
		  t2holdmon2 = `${t2hold2}, , , , `;
		}
	  }
	  const t1hold3 = document.getElementById('t1hold3').value;
	  const t2hold3 = document.getElementById('t2hold3').value;
	  var t1holdmon3 = [];
	  var t2holdmon3 = [];
	  if (t1hold3 != ''){
		t1holdmon3 = loaded.find(row => row[0] === t1hold3);
		if (t1holdmon3 !== undefined){
		  t1holdmon3 = t1holdmon3.join(',');
		} else {
		  t1holdmon3 = `${t1hold3}, , , , '`
		}
	  }
	  if (t2hold3 != ''){
		t2holdmon3 = loaded.find(row => row[0] === t2hold3);
		if (t2holdmon3 !== undefined){
		  t2holdmon3 = t2holdmon3.join(',');
		} else {
		  t2holdmon3 = `${t2hold3}, , , , `;
		}
	  }
	  var t1holdlst = [t1hold, t1hold2, t1hold3];
	  var t2holdlst = [t2hold, t2hold2, t2hold3];
	  var megasList = [];
      var flatSubset = subset.map(row => row.join(','));
	  if(allowDuplicates){
		flatSubset.push(...flatSubset);
		flatSubset.push(...flatSubset);
		flatSubset.push(...flatSubset);
	  }
	  // First shuffle
	  var firstShuffle = shuffleArray(flatSubset, seedInput + '_1');
	  // Second shuffle
      var secondShuffle = shuffleArray(flatSubset, seedInput + '_2');
	  if(megas){
	  const megaMin = parseInt(document.getElementById('megaLimitMin').value);
	  const megaMax = parseInt(document.getElementById('megaLimitMax').value);
	  const megasubset = mega.slice(megaMin-1, megaMax);
      var megaflat = megasubset.map(row => row.join(','));
	  var megaShuffle = shuffleArray(megaflat, seedInput + '_3');
	  var megaShuffle1 = megaShuffle[0];
		if(teamUnique){
			var megaShuffle2 = megaShuffle[1];
		} else {
			var megaShuffle2 = shuffleArray(megaflat, seedInput + '_4')[0];
		}
		console.log(megaShuffle1, megaShuffle2);
		megasList = [megaShuffle1, megaShuffle2];
	  }
	  if(teamUnique){
		firstShuffle = getUniqueSpecies(firstShuffle, 12, megasList, t1holdlst, t2holdlst);
		if(t1hold3 != ''){
			firstShuffle.unshift(t1holdmon3);
		}
		if(t1hold2 != ''){
			firstShuffle.unshift(t1holdmon2);
		}
		if(t1hold != ''){
			firstShuffle.unshift(t1holdmon);
		}
		if(t2hold3 != ''){
			firstShuffle.splice(6, 0, t2holdmon3);
		}
		if(t2hold2 != ''){
			firstShuffle.splice(6, 0, t2holdmon2);
		}
		if(t2hold != ''){
			firstShuffle.splice(6, 0, t2holdmon);
		}
		if(megas){
		 firstShuffle.unshift(megaShuffle1);
		 firstShuffle[6] = megaShuffle2;
		}
			displayResults('first6', firstShuffle.slice(0,6));
			displayResults('fullList', firstShuffle.slice(6,12));
		}
	  else{
		if(enforceUnique){
			firstShuffle = getUniqueSpecies(firstShuffle, 12, [megaShuffle1], t1holdlst, []);
		}
	  	if(enforceUnique){
		secondShuffle  = getUniqueSpecies(secondShuffle, 12, [megaShuffle2], [], t2holdlst);
		}
		if(t1hold3 != ''){
			firstShuffle.unshift(t1holdmon3);
		}
		if(t1hold2 != ''){
			firstShuffle.unshift(t1holdmon2);
		}
		if(t1hold != ''){
			firstShuffle.unshift(t1holdmon);
		}
	  if(t2hold3 != ''){
		secondShuffle.unshift(t2holdmon3);
	  }
	  if(t2hold2 != ''){
		secondShuffle.unshift(t2holdmon2);
	  }
	  if(t2hold != ''){
		secondShuffle.unshift(t2holdmon);
	  }
	if(megas){
	 firstShuffle.unshift(megaShuffle1);
	 secondShuffle.unshift(megaShuffle2);
	}
	if(allowForms && (t1hold != '' || t2hold != '' || t1hold2 != '' || t2hold2 != '' || t1hold3 != '' || t2hold3 != '')){
	  firstShuffle = [...new Set(firstShuffle)];
	  secondShuffle = [...new Set(secondShuffle)];
	}
	  displayResults('first6', firstShuffle.slice(0,6));
      displayResults('fullList', secondShuffle.slice(0,6));
	  }
    }
  function updateUrlWithInputs() {
	  const params = new URLSearchParams();

	  // Get all input/select elements
	  const inputs = document.querySelectorAll('input, select, textarea');

	  inputs.forEach(input => {
		const name = input.name || input.id;
		if (!name) return; // skip inputs without name or id

		if (input.type === 'checkbox') {
		  if (input.checked) params.append(name, input.value);
		} else if (input.type === 'radio') {
		  if (input.checked) params.append(name, input.value);
		} else {
		  if (input.value) params.append(name, input.value);
		}
	  });

	  // Build new URL with updated query string
	  const newUrl =
		window.location.protocol +
		'//' +
		window.location.host +
		window.location.pathname +
		'?' +
		params.toString();

	  // Update URL without reloading page
	  history.replaceState(null, '', newUrl);
  }
  function setInputsFromUrl() {
	  const params = new URLSearchParams(window.location.search);

	  const inputs = document.querySelectorAll('input, select, textarea');

	  inputs.forEach(input => {
		const name = input.name || input.id;
		if (!name) return;

		if (!params.has(name)) return;

		const value = params.getAll(name); // getAll for multiple values (checkbox groups)

		if (input.type === 'checkbox') {
		  // For checkboxes: check if this input's value is among the URL values
		  input.checked = value.includes(input.value);
		} else if (input.type === 'radio') {
		  input.checked = value.includes(input.value);
		} else {
		  // For other inputs/selects, just set first value
		  input.value = value[0];
		}
	  });
  }
