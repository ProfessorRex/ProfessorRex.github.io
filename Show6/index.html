<!DOCTYPE html>
<html lang="en">
<!-- Add a spooky or impactful font for "SHADOW" Pokémon -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>

    font-family: 'Orbitron', sans-serif;

    text-shadow: 1px 1px 2px black;

	.type-fire      { color: #e25822; font-family: 'Orbitron', sans-serif; }
	.type-water     { color: #1e90ff; font-family: 'Orbitron', sans-serif; }
	.type-grass     { color: #228b22; font-family: 'Orbitron', sans-serif; }
	.type-electric  { color: #ffd700; font-family: 'Orbitron', sans-serif; }
	.type-ice       { color: #00ced1; font-family: 'Orbitron', sans-serif; }

<head>
  <meta charset="UTF-8">
  <title>Show 6 Team Randomizer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; }
    textarea { width: 100%; height: 100px; margin-top: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Show 6 Team Randomizer</h1>

  <label for="seed">Enter Random Seed:</label>
  <input type="text" id="seed" />
  <button onclick="generateNewSeed()">Generate New Seed</button>

  <label for="rowLimitMin">Min PVP Poke Rank:</label>
  <input type="number" id="rowLimitMin" value="1" min="1" />
  <label for="rowLimitMax">Max PVP Poke Rank:</label>
  <input type="number" id="rowLimitMax" value="200" min="1" />
  

  <button onclick="processCSV()">Randomize Teams</button>

  <h2>Team 1:</h2>
  <pre id="first6" style="background-color:black;"></pre>

  <h2>Team 2:</h2>
  <pre id="fullList" style="background-color:black;"></pre>

  <script>
	function generateNewSeed() {
	  const newSeed = Math.random().toString(36).substring(2, 10); // random 8-char seed
	  document.getElementById('seed').value = newSeed;
	  processCSV(); // refresh the randomized output
	}
	 // Generate a random seed string on page load
	window.addEventListener('DOMContentLoaded', () => {
	  const randomSeed = Math.random().toString(36).substring(2, 10); // e.g., "k4fj29xm"
	  document.getElementById('seed').value = randomSeed;
	});
  
    // Load local CSV (same directory)
    let csvData = [];
	let evil = Math.random();
    fetch('data.csv')
      .then(response => response.text())
      .then(text => {
        const parsed = Papa.parse(text.trim(), { header: false });
        csvData = parsed.data.filter(row => row.length > 0);
        console.log('CSV Loaded:', csvData);
		processCSV();
      });

  // Better seeded PRNG using a simple LCG (Linear Congruential Generator)
  function seedRandom(seedStr) {
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) {
      seed += seedStr.charCodeAt(i);
    }
    return function () {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }

  function shuffleArray(array, seedStr) {
    let rand = seedRandom(seedStr);
    let arr = array.slice(); // clone the array
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
      // Display CSV line + PvPoke links
    function displayResults(targetId, list) {
      const container = document.getElementById(targetId);

      const baseUrl = "https://pvpoke.com/rankings/all/1500/overall/";
      const linksHtml = list.map(pkmn => {
		const name = pkmn.split(',')[0]
		const t1 = pkmn.split(',')[3]
		const t2 = pkmn.split(',')[4]
        const url = baseUrl + encodeURIComponent(name.toLowerCase().replace(/ /g, "_").replace(/[()]/g, '')) + "/";
        const isShadow = name.toUpperCase().includes("SHADOW");
		const types = [t1].filter(e => e !== 'none');
		console.log(types)
		const typeClasses = types.map(t => `type-${t}`).join(' ');;
		if (name.toUpperCase().endsWith("(SHADOW)")) {
		const parts = name.split(/\s+/); // split by space
		const restName = parts.shift();; // e.g., "Machamp"
		const shadowWord =  parts.join(' ')// "Shadow"
		shadowStyled = `<span class="shadow-link">${shadowWord}</span>`;
		typeStyled = `<span class="${typeClasses}">${restName}</span>`;
		displayName = `${typeStyled} ${shadowStyled}`;
		} else {
		  displayName = `<span class="${typeClasses}">${name}</span>`;
		}
		if(evil>0.9){
			displayName = displayName.replace("Shadow", "EVIL");
		}
        return `<div><a href="${url}" target="_blank">${displayName}</a></div>`;
      }).join('');

      container.innerHTML = `${linksHtml}`;
    }

    function processCSV() {
      const seedInput = document.getElementById('seed').value;
      const limitMin = parseInt(document.getElementById('rowLimitMin').value);
	  const limitMax = parseInt(document.getElementById('rowLimitMax').value);

      if (!csvData.length) {
        alert("CSV not loaded yet!");
        return;
      }

      const subset = csvData.slice(limitMin-1, limitMax);
      const flatSubset = subset.map(row => row.join(','));

      // First shuffle
      const firstShuffle = shuffleArray(flatSubset, seedInput + '_1');
      displayResults('first6', firstShuffle.slice(0,6));

      // Second shuffle
      const secondShuffle = shuffleArray(flatSubset, seedInput + '_2');
      displayResults('fullList', secondShuffle.slice(0,6));
    }
  </script>
</body>
</html>
