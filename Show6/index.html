<!DOCTYPE html>
<html lang="en">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
  .shadow-link {
    font-family: 'Orbitron', sans-serif;
    color: #8D71B4;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
  }
	.type-fire      { color: #e25822; font-family: 'Orbitron', sans-serif; }
	.type-water     { color: #1e90ff; font-family: 'Orbitron', sans-serif; }
	.type-grass     { color: #228b22; font-family: 'Orbitron', sans-serif; }
	.type-electric  { color: #ffd700; font-family: 'Orbitron', sans-serif; }
	.type-ice       { color: #00ced1; font-family: 'Orbitron', sans-serif; }
	.type-fighting  { color: #b22222; font-family: 'Orbitron', sans-serif; }
	.type-poison    { color: #8a2be2; font-family: 'Orbitron', sans-serif; }
	.type-ground    { color: #d2b48c; font-family: 'Orbitron', sans-serif; }
	.type-flying    { color: #87ceeb; font-family: 'Orbitron', sans-serif; }
	.type-psychic   { color: #ff1493; font-family: 'Orbitron', sans-serif; }
	.type-bug       { color: #9acd32; font-family: 'Orbitron', sans-serif; }
	.type-rock      { color: #a0522d; font-family: 'Orbitron', sans-serif; }
	.type-ghost     { color: #663399; font-family: 'Orbitron', sans-serif; }
	.type-dragon    { color: #483d8b; font-family: 'Orbitron', sans-serif;  text-shadow: -1px -1px 0 #8D71B4, 1px -1px 0 #8D71B4, 1px 1px 0 #8D71B4,
    1px 1px 0 #8D71B4;}
	.type-dark      { color: #333; font-family: 'Orbitron', sans-serif;  text-shadow: -1px -1px 0 white, 1px -1px 0 white, 1px 1px 0 white,
    1px 1px 0 white;}
	.type-normal    { color: #f9f4d8; font-family: 'Orbitron', sans-serif; }
	.type-steel     { color: #708090; font-family: 'Orbitron', sans-serif; }
	.type-fairy     { color: #ffb6c1; font-family: 'Orbitron', sans-serif; }
	
	.table-layout {
    display: flex;
    gap: 20px;
	border-collapse: collapse;
    justify-content: center;
    align-items: flex-start;
    flex-direction: column; /* default: stacked vertically */
  }

  /* When screen is wider than tall (e.g., landscape) */
  @media (min-aspect-ratio: 4/3) {
    .table-layout {
      flex-direction: row; /* side by side */
    }
  }

  .table-wrapper {
    overflow-y: auto;
    border: 1px solid #ccc;
    flex: 1;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td, th {
    padding: 10px;
    text-align: center;
    vertical-align: top;
  }

  .image-stack {
    position: relative;
    width: 100%;
    max-width: 120px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 8px;
	/*image-rendering: pixelated;*/
  }

  .image-stack img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


    .image-stack img.back {
      z-index: 0;
	  image-rendering: pixelated;
    }

    .image-stack img.front {
      z-index: 1;
    }
  .league-selector {
    display: flex;
    justify-content: flex-start;
    gap: 40px; /* spacing between columns */
    margin: 0px 0;
  }

  .league-option {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .league-option label {
    margin-bottom: 5px;
    font-weight: bold;
  }
</style>
<head>
  <meta charset="UTF-8">
  <title>Show 6 Team Randomizer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; }
    textarea { width: 100%; height: 100px; margin-top: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <b>Show 6 Team Randomizer</b>
<fieldset style="border: none; margin: 0px 0;">
<div class="league-selector">
  <div class="league-option">
    <label for="league-g">Great</label>
    <input type="radio" id="league-g" name="league" value="great" checked onchange="onLoad()">
  </div>

  <div class="league-option">
    <label for="league-u">Ultra</label>
    <input type="radio" id="league-u" name="league" value="ultra" onchange="onLoad()">
  </div>

  <div class="league-option">
    <label for="league-m">Master</label>
    <input type="radio" id="league-m" name="league" value="master" onchange="onLoad()">
  </div>
</div>
  <label for="seed">Enter Random Seed:</label>
  <input type="text" id="seed" />
  <button onclick="generateNewSeed()">Generate New Seed</button>
<label>
  <input type="checkbox" id="uniqueSpeciesCheckbox" checked onchange="onLoad()">
  Unique Species Per Team
</label>
<label>
  <input type="checkbox" id="uniqueTeamCheckbox" onchange="onLoad()">
  Unique Species Across Teams
</label>
  <label for="rowLimitMin">Min PVP Poke Rank:
  <input type="number" id="rowLimitMin" value="1" min="1" style="width: 5ch;" onchange="onLoad()"/>
  </label>
  <label for="rowLimitMax">Max PVP Poke Rank:
  <input type="number" id="rowLimitMax" value="200" min="1" style="width: 5ch;" onchange="onLoad()"/>
  </label>
<label>
  <input type="checkbox" id="showMoves" onchange="onLoad()">
  Show Movesets
</label>
<label>
  <input type="checkbox" id="noShadow" checked onchange="onLoad()">
  Show Shadow Mons
</label>
<label>
  <input type="checkbox" id="noShiny" checked onchange="onLoad()">
  Show Shiny Star at 1/<input type="number" id="shinyChance" value="10" min="1" style="width: 5ch;" onchange="onLoad()"> chance.
</label>
  <button onclick="onLoad()">Randomize Teams</button>
<div class="table-layout">
  <div class="table-wrapper">
  <h2> Team 1:</h2>
  <font size='3px;'>
  <table id="first6" style="background-color:black; padding: 15px; table-layout: fixed; text-align: center;"></table>
</font>
  </div>

  <div class="table-wrapper">
  <h2> Team 2:</h2>
  <font size='3px;'>
  <table id="fullList" style="background-color:black; padding: 15px; table-layout: fixed;  text-align: center; "></table>
 </div></div>
<br><BR><BR>
Rankings obtained from <a href="https://pvpoke.com/rankings/all/1500/overall/">pvppoke.com</a>
  <script>
	 // Declare variables
	let csvData = [];
	let shinyChance = parseInt(document.getElementById('shinyChance').value);
	let evilChance = 10; // 1/evilchance
	let seed = 0;
	
	async function generateNewSeed() {
	  const newSeed = Math.random().toString(36).substring(2, 10); // random 8-char seed
	  document.getElementById('seed').value = newSeed;
	  const loaded = await loadCSV();
	  processCSV(loaded); // refresh the randomized output
	}
	 // Generate a random seed string on page load
	window.addEventListener('DOMContentLoaded', () => {
	  const randomSeed = Math.random().toString(36).substring(2, 10); // e.g., "k4fj29xm"
	  document.getElementById('seed').value = randomSeed;
	  onLoad();
	});
	async function onLoad(){
	     // Declare variables
		csvData = [];
		shinyChance = parseInt(document.getElementById('shinyChance').value);
		evilChance = 10; // 1/evilchance
		seed = 0;
		const loaded = await loadCSV();
		processCSV(loaded);
	}
	function getSelectedLeague() {
	  const selected = document.querySelector('input[name="league"]:checked');
	  return selected ? selected.value : null;
	}
	async function loadCSV(){
		var csvData = [];
		var csvName= `${getSelectedLeague()}.csv`;
		await fetch(csvName)
		  .then(response => response.text())
		  .then(text => {
			const parsed = Papa.parse(text.trim(), { header: false });
			csvData = parsed.data.filter(row => row.length > 0).slice(1);
		  });
		 return csvData;
		 
	}
	
  // Better seeded PRNG using a simple LCG (Linear Congruential Generator)
  function seedRandom(seedStr) {
    for (let i = 0; i < seedStr.length; i++) {
      seed += seedStr.charCodeAt(i);
    }
    return function () {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }

  function shuffleArray(array, seedStr) {
    let rand = seedRandom(seedStr);
    let arr = array.slice(); // clone the array
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
      // Display CSV line + PvPoke links
    function displayResults(targetId, list) {
      const container = document.getElementById(targetId);
      const baseUrl = "https://pvpoke.com/rankings/all/1500/overall/";
	  var count = 0;
      const linksHtml = list.map(pkmn => {
		var name = pkmn.split(',')[0]
		const t1 = pkmn.split(',')[3]
		const t2 = pkmn.split(',')[4]
        const url = baseUrl + encodeURIComponent(name.toLowerCase().replace(/ /g, "_").replace(/[()]/g, '')) + "/";
        const isShadow = name.toUpperCase().includes("SHADOW");
		const types = [t1].filter(e => e !== 'none');
		const typeClasses = types.map(t => `type-${t}`).join(' ');;
		var shadow = '<img src="shadowN.png" class="back">';
		var shadowWord = ''
		const showShadow = document.getElementById('noShadow').checked;
		if (name.toUpperCase().endsWith("(SHADOW)")) {
		const restName = name.slice(0,-9); // e.g., "Machamp"
		if(showShadow){
		shadow = '<img src="shadow.gif" class="back">';
		shadowWord = "(Shadow)"
		typeStyled = `<span class="${typeClasses}">${restName}</span> `;
		} else {
		 typeStyled = `<span class="${typeClasses}">${restName}</span>`;
		}
		shadowStyled = `<span class="shadow-link">${shadowWord}</span>`;
		displayName = `${typeStyled}${shadowStyled}`;
		name = restName;
		} else {
		  displayName = `<span class="${typeClasses}">${name}</span>`;
		}
		name = name.replace("Alolan", "Alola").replace("Galarian", "Galar").replace("Unovan", "Unova").replace("Hisuian", "Hisui").replace("'","").replace("Paldean", "Paldea").replace(" (Full Belly)", "").replace("Female",'f').replace(" (Male)","").replace(" (Standard)",'').replace(" (Baile)",'').replace("10% Forme",'10').replace("Complete Forme",'Complete').replace(" (Midday)",'').replace(" (Ordinary)",'').replace(" (Hero)",'').replace("Tauros (",'Tauros (Paldea').replace(" (Average)",'').replace(" (Altered)",'').replace(" (Aria)",'').replace("Crowned Shield",'Crowned').replace("Crowned Sword",'Crowned');
		seedRandom(seed.toString());
		if(seed%evilChance==0){
			displayName = displayName.replace("Shadow", "EVIL");
		}
		seedRandom(seed.toString());
		var shiny = '';
		if(seed%shinyChance==0){
		var form = "-shiny"
		if(document.getElementById('noShiny').checked){
		shiny = `<span style="font-size: 24px; color: gold;">&#9733;</span> `;
		}
		} else {
		var form = ""
		}
		var beginning = "";
		var end = "";
		if(count==0){
			beginning = "<tr>";
		}
		if(count==2){
			end = "</tr>";
		}
		if(count==3){
			beginning = "<tr>";
		}
		count = count + 1;
		 const showMoves = document.getElementById('showMoves').checked;
		var moves = '';
		if(showMoves){
			moves = `<br>${pkmn.split(',')[11]}<br>${pkmn.split(',')[12]}<br>${pkmn.split(',')[13]}<br>`;
		}
		var imgurl = `https://play.pokemonshowdown.com/sprites/home-centered${form}/${name.replace('-','').replace(' (', '-').replace(/[()]/g, '').toLowerCase().replace('-single strike','').replace('-incarnate','').replace('rapid strike','rapidstrike').replace('-overcast','').replace('-50% forme','').replace('-land','').replace('.','').replace(' ', '')}.png`;
        if(name=="Mewtwo (Armored)"){
			shiny = '';
			imgurl='https://images.gameinfo.io/pokemon/256/p150f85.png';
		}
		return `${beginning}<td><div class="image-stack">${shadow}<img src="${imgurl}" class="front"></div><div><a href="${url}" target="_blank">${shiny}${displayName}</a><font color="white">${moves}</font></div></td>${end}`;
      }).join('');

      container.innerHTML = `${linksHtml}`;
    }

	function getUniqueSpecies(pokemonList, len) {
	  var uniqueList = [];
	  var seenSpecies = new Set();
	  for (const mon of pokemonList) {
		const species = mon.split(",")[0].split(" ")[0] // first word of name
		if (!seenSpecies.has(species)) {
		  uniqueList.push(mon);
		  seenSpecies.add(species);
		}
		if (uniqueList.length === len) break;
	  }
	  return uniqueList;
	}

    function processCSV(loaded) {
	  seed = 0;
      const seedInput = document.getElementById('seed').value;
	  shinyChance = parseInt(document.getElementById('shinyChance').value);
      const limitMin = parseInt(document.getElementById('rowLimitMin').value);
	  const limitMax = parseInt(document.getElementById('rowLimitMax').value);
	  
      

      const subset = loaded.slice(limitMin-1, limitMax);
      const flatSubset = subset.map(row => row.join(','));
	

      // First shuffle
	  var firstShuffle = shuffleArray(flatSubset, seedInput + '_1');
	  const teamUnique = document.getElementById('uniqueTeamCheckbox').checked;
	  if(teamUnique){
			firstShuffle = getUniqueSpecies(firstShuffle, 12)
			displayResults('first6', firstShuffle.slice(0,6));
			displayResults('fullList', firstShuffle.slice(6,12));
		}
	  else{
	  const enforceUnique = document.getElementById('uniqueSpeciesCheckbox').checked;
		if(enforceUnique){
			firstShuffle = getUniqueSpecies(firstShuffle, 6)
		}
      // Second shuffle
      var secondShuffle = shuffleArray(flatSubset, seedInput + '_2');
	  	if(enforceUnique){
			secondShuffle = getUniqueSpecies(secondShuffle, 6)
		}
	  displayResults('first6', firstShuffle.slice(0,6));
      displayResults('fullList', secondShuffle.slice(0,6));
	  }
    }
  </script>
</body>
</html>
