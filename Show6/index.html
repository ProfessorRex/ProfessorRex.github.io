<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV Randomizer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; }
    textarea { width: 100%; height: 100px; margin-top: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>CSV Randomizer</h1>

  <label for="seed">Enter Random Seed:</label>
  <input type="text" id="seed" value="1234" />

  <label for="rowLimit">Max Rows to Consider:</label>
  <input type="number" id="rowLimit" value="10" min="1" />

  <button onclick="processCSV()">Randomize CSV</button>

  <h2>First 6 Randomized Entries:</h2>
  <pre id="first6"></pre>

  <h2>Second Randomized Full List:</h2>
  <pre id="fullList"></pre>

  <script>
    // Load local CSV (same directory)
    let csvData = [];

    fetch('data.csv')
      .then(response => response.text())
      .then(text => {
        const parsed = Papa.parse(text.trim(), { header: false });
        csvData = parsed.data.filter(row => row.length > 0);
        console.log('CSV Loaded:', csvData);
      });

    function seedRandom(seed) {
      let x = Math.sin(seed) * 10000;
      return () => {
        x = Math.sin(x) * 10000;
        return x - Math.floor(x);
      };
    }

    function shuffleArray(array, seed) {
      let rand = seedRandom(seed);
      let arr = array.slice(); // copy
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function processCSV() {
      const seedInput = document.getElementById('seed').value;
      const limit = parseInt(document.getElementById('rowLimit').value);

      if (!csvData.length) {
        alert("CSV not loaded yet!");
        return;
      }

      const subset = csvData.slice(0, limit);
      const flatSubset = subset.map(row => row.join(','));

      // First shuffle
      const firstShuffle = shuffleArray(flatSubset, seedInput + '_1');
      document.getElementById('first6').textContent = firstShuffle.slice(0, 6).join('\n');

      // Second shuffle
      const secondShuffle = shuffleArray(flatSubset, seedInput + '_2');
      document.getElementById('fullList').textContent = secondShuffle.join('\n');
    }
  </script>
</body>
</html>
