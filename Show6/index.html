	.table-layout {
    display: flex;
    gap: 20px;
	border-collapse: collapse;
    justify-content: center;
    align-items: flex-start;
    flex-direction: column; /* default: stacked vertically */
  }

  /* When screen is wider than tall (e.g., landscape) */
  @media (min-aspect-ratio: 4/3) {
    .table-layout {
      flex-direction: row; /* side by side */
    }
  }

  .table-wrapper {
    overflow-y: auto;
    border: 1px solid #ccc;
    flex: 1;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td, th {
    padding: 10px;
    text-align: center;
    vertical-align: top;
  }

  .image-stack {
    position: relative;
    width: 100%;
    max-width: 120px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 8px;
	image-rendering: pixelated;
  }

  .image-stack img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


    .image-stack img.back {
      z-index: 0;
    }

    .image-stack img.front {
      z-index: 1;
    }

</style>
<head>
  <meta charset="UTF-8">
  <title>Show 6 Team Randomizer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; }
    textarea { width: 100%; height: 100px; margin-top: 0.5rem; }
    pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Show 6 Team Randomizer</h1>

  <label for="seed">Enter Random Seed:</label>
  <input type="text" id="seed" />
  <button onclick="generateNewSeed()">Generate New Seed</button>
<label>
  <input type="checkbox" id="uniqueSpeciesCheckbox" checked>
  Unique Species Per Team
</label>
<label>
  <input type="checkbox" id="uniqueTeamCheckbox">
  Unique Species Across Teams
</label>
  <label for="rowLimitMin">Min PVP Poke Rank:</label>
  <input type="number" id="rowLimitMin" value="1" min="1" />
  <label for="rowLimitMax">Max PVP Poke Rank:</label>
  <input type="number" id="rowLimitMax" value="200" min="1" />
  
<label>
  <input type="checkbox" id="showMoves">
  Show Movesets
</label>
  <button onclick="processCSV()">Randomize Teams</button>
<div class="table-layout">
  <div class="table-wrapper">
  <h2> Team 1:</h2>
  <font size='3px;'>
  <table id="first6" style="background-color:black; padding: 15px; table-layout: fixed; text-align: center;"></table>
</font>
  </div>

  <div class="table-wrapper">
  <h2> Team 2:</h2>
  <font size='3px;'>
  <table id="fullList" style="background-color:black; padding: 15px; table-layout: fixed;  text-align: center; "></table>
 </div></div>
<br><BR><BR>
Rankings obtained from <a href="https://pvpoke.com/rankings/all/1500/overall/">pvppoke.com</a>
  <script>
	function generateNewSeed() {
	  const newSeed = Math.random().toString(36).substring(2, 10); // random 8-char seed
	  document.getElementById('seed').value = newSeed;
	  evil = Math.random();
	  processCSV(); // refresh the randomized output
	}
	 // Generate a random seed string on page load
	window.addEventListener('DOMContentLoaded', () => {
	  const randomSeed = Math.random().toString(36).substring(2, 10); // e.g., "k4fj29xm"
	  document.getElementById('seed').value = randomSeed;
	});
  
    // Load local CSV (same directory)
    let csvData = [];
	let shinyChance = 10; // = 1/shinychance
	let evilChance = 10; // 1/evilchance
	let evil = Math.random();
	let seed = 0;
    fetch('data.csv')
      .then(response => response.text())
      .then(text => {
        const parsed = Papa.parse(text.trim(), { header: false });
        csvData = parsed.data.filter(row => row.length > 0).slice(1);
        console.log('CSV Loaded:', csvData);
		processCSV();
      });

  // Better seeded PRNG using a simple LCG (Linear Congruential Generator)
  function seedRandom(seedStr) {
    for (let i = 0; i < seedStr.length; i++) {
      seed += seedStr.charCodeAt(i);
    }
    return function () {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }

  function shuffleArray(array, seedStr) {
    let rand = seedRandom(seedStr);
    let arr = array.slice(); // clone the array
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
      // Display CSV line + PvPoke links
    function displayResults(targetId, list) {
      const container = document.getElementById(targetId);
      const baseUrl = "https://pvpoke.com/rankings/all/1500/overall/";
	  var count = 0;
      const linksHtml = list.map(pkmn => {
		var name = pkmn.split(',')[0]
		const t1 = pkmn.split(',')[3]
		const t2 = pkmn.split(',')[4]
        const url = baseUrl + encodeURIComponent(name.toLowerCase().replace(/ /g, "_").replace(/[()]/g, '')) + "/";
        const isShadow = name.toUpperCase().includes("SHADOW");
		const types = [t1].filter(e => e !== 'none');
		const typeClasses = types.map(t => `type-${t}`).join(' ');;
		var shadow = '<img src="shadowN.png" class="back">';
		if (name.toUpperCase().endsWith("(SHADOW)")) {
		shadow = '<img src="shadow.gif" class="back">';
		const restName = name.slice(0,-9); // e.g., "Machamp"
		const shadowWord = "(Shadow)"
		shadowStyled = `<span class="shadow-link">${shadowWord}</span>`;
		typeStyled = `<span class="${typeClasses}">${restName}</span>`;
		displayName = `${typeStyled} ${shadowStyled}`;
		name = restName;
		} else {
		  displayName = `<span class="${typeClasses}">${name}</span>`;
		}
		name = name.replace("Alolan", "Alola").replace("Galarian", "Galar").replace("Unovan", "Unova").replace("Hisuian", "Hisui").replace("'","");
		seedRandom(seed.toString());
		if(seed%evilChance==0){
			displayName = displayName.replace("Shadow", "EVIL");
		}
		seedRandom(seed.toString());
		if(seed%shinyChance==0){
		var form = "shiny"
		} else {
		var form = "regular"
		}
		var beginning = "";
		var end = "";
		if(count==0){
			beginning = "<tr>";
		}
		if(count==2){
			end = "</tr>";
		}
		if(count==3){
			beginning = "<tr>";
		}
		count = count + 1;
		 const showMoves = document.getElementById('showMoves').checked;
		var moves = '';
		if(showMoves){
			moves = `<br>${pkmn.split(',')[11]}<br>${pkmn.split(',')[12]}<br>${pkmn.split(',')[13]}<br>`;
		}
        return `${beginning}<td><div class="image-stack">${shadow}<img src="https://raw.githubusercontent.com/msikma/pokesprite/master/pokemon-gen8/${form}/${name.replace(' ', '-').replace(/[()]/g, '').toLowerCase()}.png" class="front"></div><div><a href="${url}" target="_blank">${displayName}</a><font color="white">${moves}</font></div></td>${end}`;
      }).join('');

      container.innerHTML = `${linksHtml}`;
    }

	function getUniqueSpecies(pokemonList, len) {
	  var uniqueList = [];
	  var seenSpecies = new Set();
	  for (const mon of pokemonList) {
		const species = mon.split(",")[0].split(" ")[0] // first word of name
		if (!seenSpecies.has(species)) {
		  uniqueList.push(mon);
		  seenSpecies.add(species);
		}
		if (uniqueList.length === len) break;
	  }
	  return uniqueList;
	}

    function processCSV() {
	  seed = 0;
      const seedInput = document.getElementById('seed').value;
      const limitMin = parseInt(document.getElementById('rowLimitMin').value);
	  const limitMax = parseInt(document.getElementById('rowLimitMax').value);

      if (!csvData.length) {
        alert("CSV not loaded yet!");
        return;
      }

      const subset = csvData.slice(limitMin-1, limitMax);
      const flatSubset = subset.map(row => row.join(','));
	

      // First shuffle
	  var firstShuffle = shuffleArray(flatSubset, seedInput + '_1');
	  const teamUnique = document.getElementById('uniqueTeamCheckbox').checked;
	  if(teamUnique){
			firstShuffle = getUniqueSpecies(firstShuffle, 12)
			displayResults('first6', firstShuffle.slice(0,6));
			displayResults('fullList', firstShuffle.slice(6,12));
		}
	  else{
	  const enforceUnique = document.getElementById('uniqueSpeciesCheckbox').checked;
		if(enforceUnique){
			firstShuffle = getUniqueSpecies(firstShuffle, 6)
		}
      displayResults('first6', firstShuffle.slice(0,6));

      // Second shuffle
      var secondShuffle = shuffleArray(flatSubset, seedInput + '_2');
	  	if(enforceUnique){
			secondShuffle = getUniqueSpecies(secondShuffle, 6)
		}
      displayResults('fullList', secondShuffle.slice(0,6));
	  }
    }
  </script>
</body>
