	async function getRandomWordFromCSV() {
	  try {
		const response = await fetch('words.csv');
		const text = await response.text();

		// Split by line and filter out any empty lines
		const words = text.trim().split(',').filter(line => line.length > 0);

		// Pick a random word
		const randomWord = words[Math.floor(Math.random() * words.length)];

		return randomWord;

	  } catch (err) {
		console.error("Failed to load CSV:", err);
		return null;
	}
	}

  // Better seeded PRNG using a simple LCG (Linear Congruential Generator)
  function seedRandom(seedStr) {
    for (let i = 0; i < seedStr.length; i++) {
      seed += seedStr.toLowerCase().charCodeAt(i);
    }
    return function () {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }

  function shuffleArray(array, seedStr) {
    let rand = seedRandom(seedStr);
    let arr = array.slice(); // clone the array
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

	function getUniqueSpecies(pokemonList, len, megas, t1hold, t2hold) {
	  var uniqueList = [];
	  var seenSpecies = new Set();
	  for (const mega of [...megas, ...t1hold, ...t2hold]){
		if(mega !== undefined && mega != ''){
		  seenSpecies.add(mega.speciesName.split(" ")[0]);
	    }
	  }
	  for (const mon of pokemonList) {
		const species = mon.speciesName.split(" (")[0] // first word of name
		if (!seenSpecies.has(species)) {
		  uniqueList.push(mon);
		  seenSpecies.add(species);
		}
		if (uniqueList.length === len) break;
	  }
	  return uniqueList;
	}

  function updateUrlWithInputs() {
	  const params = new URLSearchParams();

	  // Get all input/select elements
	  const inputs = document.querySelectorAll('input, select, textarea');

	  inputs.forEach(input => {
		const name = input.name || input.id;
		if (!name) return; // skip inputs without name or id

		if (input.type === 'checkbox') {
		  if (input.checked) params.append(name, input.value);
		} else if (input.type === 'radio') {
		  if (input.checked) params.append(name, input.value);
		} else {
		  if (input.value) params.append(name, input.value);
		}
	  });

	  // Build new URL with updated query string
	  const newUrl =
		window.location.protocol +
		'//' +
		window.location.host +
		window.location.pathname +
		'?' +
		params.toString();

	  // Update URL without reloading page
	  history.replaceState(null, '', newUrl);
  }
  function setInputsFromUrl() {
	  const params = new URLSearchParams(window.location.search);

	  const inputs = document.querySelectorAll('input, select, textarea');

	  inputs.forEach(input => {
		const name = input.name || input.id;
		if (!name) return;

		if (!params.has(name)) return;

		const value = params.getAll(name); // getAll for multiple values (checkbox groups)

		if (input.type === 'checkbox') {
		  // For checkboxes: check if this input's value is among the URL values
		  input.checked = value.includes(input.value);
		} else if (input.type === 'radio') {
		  input.checked = value.includes(input.value);
		} else {
		  // For other inputs/selects, just set first value
		  input.value = value[0];
		}
	  });
  }
