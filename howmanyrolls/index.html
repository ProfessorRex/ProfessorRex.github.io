	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>How Many Rolls?</title>
	<style>
		body {

			width: 90px;

		}

			flex: 1;

			height: 14px;

		}

			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.8rem;
			color: #374151;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>How Many Rolls Calculator</h1>
		<div class="subtitle">
			Determine how many Shiny Rolls best explain your data.
		</div>

		<div class="field">
			<label>Base odds denominator (x)</label>
			<input id="xInput" type="number" min="2" step="1" value="4096" />
			<div class="helper">Base odds are interpreted as 1/x (x must be greater than 1).</div>
		</div>

		<div class="field">
			<label>Number of shinys found</label>
			<input id="shinys" type="number" min="0" value="1" />
		</div>

		<div class="field">
			<label>Number of Pokémon Seen</label>
			<input id="trials" type="number" min="1" value="1000" />
		</div>

		<button onclick="analyze()">Analyze Odds</button>

		<div class="results" id="results">
			<div class="headline" id="best"></div>
			<div class="explain">
				Each model assumes odds of <span class="math">1 - (1 - 1/x)<sup>i</sup></span> for i = 1 to 10.
			</div>
			<div id="rows"></div>
		</div>
	<br>
	<a href="https://www.youtube.com/@ProfessorRex"><img src="rex.png" height="155vh"></a>
	</div>

	<script>
	// probability of at least one success per i rolls: 1 - ((1-(1/x)^i)
		function modelProbability(x, i) {
			return 1 - Math.pow(1 - 1 / x, i)
		}
	
	// Calculate the probability of n successes in k trials with p chance of success
	// Using natual log to avoid underflow
		function logLikelihood(k, n, p) {
			if (p <= 0 || p >= 1) return -Infinity
			return k * Math.log(p) + (n - k) * Math.log(1 - p)
		}

	// rescale results to a sum of 1 (normalize results)
		function normalize(logs) {
			const maxLog = Math.max(...logs)
			const exps = logs.map(l => Math.exp(l - maxLog))
			const sum = exps.reduce((a, b) => a + b, 0)
			return exps.map(v => v / sum)
		}

		function analyze() {
			const x = Number(document.getElementById('xInput').value)
			const k = Number(document.getElementById('shinys').value)
			const n = Number(document.getElementById('trials').value)

			if (x <= 1) {
				alert('x must be greater than 1')
				return
			}

			if (k > n) {
				alert('shinys cannot exceed trials')
				return
			}

			const probs = []
			const logLs = []
	
			for (let i = 1; i <= 15; i++) {
				const p = modelProbability(x, i)
				probs.push(p)
				logLs.push(logLikelihood(k, n, p))
			}

			const post = normalize(logLs)
			const bestIndex = post.indexOf(Math.max(...post))

			document.getElementById('best').textContent =
				`Most likely model: ${bestIndex + 1} rolls per trial`

			const rows = document.getElementById('rows')
			rows.innerHTML = ''

			for (let i = 0; i < 15; i++) {
				const row = document.createElement('div')
				row.className = 'row'

				const label = document.createElement('div')
				label.className = 'row-label'
				label.innerHTML = `${i + 1} ${i === 0 ? 'Roll' : 'Rolls'}<br><span class="math">1/${parseFloat((1/probs[i]).toFixed(3))}</span>`

				const track = document.createElement('div')
				track.className = 'track'

				const fill = document.createElement('div')
				fill.className = 'fill' + (i === bestIndex ? ' best' : '')
				fill.style.width = `${(post[i] * 100).toFixed(1)}%`

				track.appendChild(fill)

				const value = document.createElement('div')
				value.className = 'value'
				value.textContent = `${(post[i] * 100).toFixed(1)}%`

				row.append(label, track, value)
				rows.appendChild(row)
			}

			document.getElementById('results').style.display = 'block'
		}
	</script>
</body>
</html>
