<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2910520384008063"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professor Rex's Safari Zone Webtool</title>
  <link rel="stylesheet" href="index.css">
  
</head>
<body>
    <div class="page-header">
        <a href="https://tilt.fyi/vJfGt2AEgM"><img id="extraImage" src="/ads/starlight.png" alt="Extra Image"></a>
    </div>
	<div class="page-content">
		<h2>Professor Rex's Safari Zone Webtool</h2>
		<div id="selector">
			<label id="languageText">Select Language:</label>
			<select id="languageSelect">
			  <option value="International">International</option>
			  <option value="Japanese">日本語</option>
			</select>
			<label id="speciesText" style="display:none;">Select Species:</label>
			<div class="grid" id="imageGrid"></div>
		</div>
		<img id="selectedImage" class="selected-image" src="" alt="Selected Image" style="display:none;">
		<br>
		<div class="settings">
		  <div class="setting">
			<label id="ballsText">Balls Remaining:</label>
			<div class="stepper">
			  <button type="button" id="decrement" onclick="const i=this.nextElementSibling;let v=parseInt(i.value)||i.min;if(v>i.min)i.value=v-1;">−</button>
			  <input type="number" id="lineInput" value="30" min="1" max="30" oninput="this.value=Math.min(this.max,Math.max(this.min,this.value))">
			  <button type="button" id="increment" onclick="const i=this.previousElementSibling;let v=parseInt(i.value)||i.min;if(v<i.max)i.value=v+1;">+</button>
			</div>
		  </div>

		  <div class="setting">
			<label id="baitText">Bait Thrown?</label>
			<input type="checkbox" id="baitRadio" name="bait">
		  </div>
		</div>

		<br>
		<button onclick="loadSequence()", id="loadButton">Load Pattern</button>

		<div class="odds" id="oddsDisplay"></div>
		<div class="buttonRow">
		<button id="watchButton" onclick="reloadPattern()" style="display:none;">Watching Carefully!</button>
		<button id="fledButton" onclick="itFled()" style="display:none;">Fled</button>
		<button id="caughtButton" onclick="itFled()" style="display:none;">Caught!</button>
		</div>
		<div class="container" id="imageContainer"></div>
		<div>
		Breakdown of the Game's Mechanics: <a href="Professor_Rex_Kanto_Safari_Research.pdf">PDF Form,</a>
		<a href="https://youtu.be/Sri4SYdwLdw"> Video Form</a>
		</div>
		<a href="../index.html">Return to Professor Rex's Main Page</a>
	</div>
	<div class="page-header">
        <a href="https://www.youtube.com/@ProfessorRex"><img id="extraImage" src="rex.png" alt="Extra Image"></a>
    </div>
</div>
<script>
let currentMon = "Chansey";
    const imageUrls = [
      "sprites/Chansey.png",
	  "sprites/Dratini.png",
	  "sprites/Dragonair.png",
	  "sprites/Tauros.png",
	  "sprites/Kangaskhan.png",
	  "sprites/Scyther.png",
	  "sprites/Pinsir.png",
	  "sprites/Parasect.png",
	  "sprites/Venomoth.png",
	  "sprites/Seaking.png",
	  "sprites/Exeggcute.png",
	  "sprites/Nidorina.png",
	  "sprites/Nidorino.png",
	  "sprites/Rhyhorn.png",
	  "sprites/Paras.png",
	  "sprites/Venonat.png",
	  "sprites/Psyduck.png",
	  "sprites/Slowpoke.png",
	  "sprites/Doduo.png",
	  "sprites/Goldeen.png",
	  "sprites/Nidoran.png",
	  "sprites/Poliwag.png",
	  "sprites/Magikarp.png",
    ];

    const grid = document.getElementById('imageGrid');
    const output = document.getElementById('output');

    let selectedIndex = 0;

    imageUrls.forEach((url, index) => {
      const div = document.createElement('div');
      div.className = 'item';

      const img = document.createElement('img');
      img.src = url;

      div.appendChild(img);
	  
	  const shinyImg = document.createElement('img');
	  shinyImg.src = url.replace('sprites/', 'sprites/shiny/');
	  
	  div.appendChild(shinyImg);


      div.addEventListener('click', () => {
        // Remove previous selection
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));

        // Select new one
        div.classList.add('selected');
        selectedIndex = index;

        currentMon = url.split('/').pop().split('.')[0];
      });

      grid.appendChild(div);
    });
	
let currentIndex = 0;
const images = { T: "T.png", L: "L.png", R: "R.png" };
let sequenceLoaded = false;

const translations = {
  International: {
    speciesText: "Select Species:",
    ballsText: "Safari Balls Remaining:",
	watchingText: "Watching Carefully!",
	fledText: "Fled",
	caughtText: "Caught!",
	loadText: "Load Pattern"
  },
  Japanese: {
    speciesText: "種類を選択してください:",
    ballsText: "残りのサファリボール数:",
	watchingText: "こちらのようすをうかがっている!",
	fledText: "にげだした",
	caughtText: "つかまえた!",
	loadText: "ロード"
  }
};

const languageSelect = document.getElementById("languageSelect");

languageSelect.addEventListener("change", () => {
  const lang = languageSelect.value;

  document.getElementById("speciesText").textContent =
    translations[lang].speciesText;

  document.getElementById("ballsText").textContent =
    translations[lang].ballsText;
  document.getElementById("watchButton").textContent =
    translations[lang].watchingText;
  document.getElementById("fledButton").textContent =
    translations[lang].fledText;
  document.getElementById("caughtButton").textContent =
    translations[lang].caughtText;
  document.getElementById("loadButton").textContent =
    translations[lang].loadText;
	

  if (lang == "Japanese"){
	document.getElementById('baitText').style.display = 'none';
	document.getElementById('baitRadio').style.display = 'none';
  } else{
  	document.getElementById('baitText').style.display = 'inline-block';
	document.getElementById('baitRadio').style.display = 'inline-block';
  }
});

async function fetchWithFallback(path, fallbackPath) {
  try {
    const response = await fetch(path);
    if (!response.ok) throw new Error("No Bait Differences");
    return await response.text();
  } catch (err) {
    if (fallbackPath) {
      try {
        const fallbackResponse = await fetch(fallbackPath);
        if (!fallbackResponse.ok) throw new Error("Fallback file not found");
        return await fallbackResponse.text();
      } catch (fallbackErr) {
        throw fallbackErr;
      }
    } else {
      throw err;
    }
  }
}

async function loadSequence() {
  const language = document.getElementById('languageSelect').value;
  const file = currentMon + ".txt";
  const lineNum = parseInt(document.getElementById('lineInput').value) - 1;
  const baited = document.getElementById('baitRadio').checked;
  document.getElementById('selector').style.display = 'none';
  document.getElementById('loadButton').style.display = 'none';
  document.getElementById('selectedImage').style.display = 'inline-block';

  if (isNaN(lineNum) || lineNum < 0 || lineNum >= 30) {
    alert("Enter a valid line number (1-30)");
    return;
  }

  let folder = language;
  let path = `${folder}/${file}`;
  let fallbackPath = null;

  if (baited) {
    path = `${folder}/Baited/${file}`;
    fallbackPath = `${folder}/${file}`;
  }

  try {
    const text = await fetchWithFallback(path, fallbackPath);
    const lines = text.split(/\r?\n/);

    if (!lines[lineNum]) {
      alert("Line not found in file.");
      return;
    }

    const line = lines[lineNum].trim();
    const parts = line.split(/\s+/);
    const sequence = parts[0];
    const odds = parts[1] || "";

    displayOdds(odds);
    renderImages(sequence);

    sequenceLoaded = true;
	document.getElementById('selectedImage').src = 'sprites/shiny/'+currentMon+".png";
    document.getElementById('watchButton').style.display = 'inline-block';
    document.getElementById('fledButton').style.display = 'inline-block';
	document.getElementById('caughtButton').style.display = 'inline-block';

  } catch (err) {
    console.error("Error loading file:", err);
    alert("Unable to load the sequence file.");
  }
}
function displayOdds(odds) {
  const oddsDiv = document.getElementById('oddsDisplay');
  if (odds) {
    const num = parseFloat(odds);
    if (!isNaN(num)) {
      const percent = (num * 100).toFixed(2);
      oddsDiv.textContent = `Odds of Successful Capture: ${percent}%`;
    } else {
      oddsDiv.textContent = "";
    }
  } else {
    oddsDiv.textContent = "";
  }
}

function renderImages(sequence) {
  const container = document.getElementById('imageContainer');
  container.innerHTML = "";
  currentIndex = 0;

  sequence.split("").forEach((char, index) => {
    const img = document.createElement("img");
    img.src = images[char];
    img.classList.add('sequence');

    if (index !== 0) img.classList.add("locked");

    img.addEventListener("click", () => handleClick(img, index));
    container.appendChild(img);
  });
}

function handleClick(img, index) {
  if (index !== currentIndex) return;

  img.classList.add("disabled");
  img.classList.remove("locked");

  const sequenceChar = img.src.includes(images.L) ? 'L' : img.src.includes(images.R) ? 'R' : 'T';
  const baitRadio = document.getElementById('baitRadio');

  if (sequenceChar === 'L') {
    const input = document.getElementById('lineInput');
    let value = parseInt(input.value);
    if (!isNaN(value) && value > 1) input.value = value - 1;
  }

  if (sequenceChar === 'T') {
    baitRadio.checked = true;
  }
  
  if (sequenceChar === 'R') {
    baitRadio.checked = false;
  }

  currentIndex++;
  const container = document.getElementById('imageContainer');
  if (container.children[currentIndex]) container.children[currentIndex].classList.remove("locked");
}

function reloadPattern() {
  if (sequenceLoaded) loadSequence();
}

function itFled() {
  document.getElementById('baitRadio').checked = false;
  document.getElementById('selector').style.display = 'inline-block';
  document.getElementById('loadButton').style.display = 'block';
  document.getElementById('watchButton').style.display = 'none';
  document.getElementById('fledButton').style.display = 'none';
  document.getElementById('caughtButton').style.display = 'none';
  document.getElementById('imageContainer').innerHTML = "";
  document.getElementById('oddsDisplay').textContent = "";
  document.getElementById('selectedImage').style.display = 'none';
  sequenceLoaded = false;
}
</script>

</body>
</html>
