<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reveal on Drag</title>
  <style>
    #canvas {
      position: relative;
      width: 520px;
      height: 360px;
      margin: 20px auto;
      border: 1px solid #ccc;
      overflow: hidden;
	  image-rendering: pixelated; /* For modern browsers */
    }

    #revealed {
      position: absolute;
	  width: 520px;
      height: 360px;
      object-fit: cover;
      z-index: 0;
	  image-rendering: pixelated; /* For modern browsers */
    }
	
	#reveal-canvas {
      position: absolute;
	  width: 520px;
      height: 360px;
      z-index: 1;
	  image-rendering: pixelated; /* For modern browsers */
    }

    .mask-img {
      position: absolute;
      width: original;
      height: original;
      z-index: 2;
      cursor: grab;
	  opacity: 0;
      outline: 2px dashed blue;
      outline-offset: -4px;
    }

    .dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>

<div id="canvas-container">
  <img id="revealed" src="../Spinda_Head_Crop.png" />
  <canvas id="reveal-canvas" width="520" height="360"></canvas>

  <!-- Dragging these masks reveals the hidden image -->
  <img src="Spot_TL.png" class="mask-img" id="mask1" style="top: 80px; left: 90px;">
  <img src="Spot_TR.png" class="mask-img" id="mask2" style="top: 100px; left: 320px;">
</div>

<a href="../index.html"  style="position: fixed; top: 500px;"> Go to Code Search</a>
<div id="mask-controls" style="position: fixed; top: 380px; left: 10px; background: #f8f8f8; padding: 10px; border: 1px solid #ccc;">
  <strong>Move Left:</strong><br>
  <div style="margin-top: 5px; flex-direction: column; align-items: center;">
  <div style="text-align: center;">
    <button onclick="moveMask('up', 'mask1')">↑</button><br>
  </div>
  <div style="display: flex; justify-content: center; gap: 5px; margin: 5px 0;">
    <button onclick="moveMask('left', 'mask1')">←</button>
    <button onclick="moveMask('down', 'mask1')">↓</button>
    <button onclick="moveMask('right', 'mask1')">→</button>
	</div>
  </div>
</div>
<div id="mask-controls" style="position: fixed; top: 380px; left: 130px; background: #f8f8f8; padding: 10px; border: 1px solid #ccc;">
  <strong>Move Right:</strong><br>
  <div style="margin-top: 5px; flex-direction: column; align-items: center;">
   <div style="text-align: center;">
    <button onclick="moveMask('up', 'mask2')">↑</button><br>
   </div>
	<div style="display: flex; justify-content: center; gap: 5px; margin: 5px 0;">
    <button onclick="moveMask('left', 'mask2')">←</button>
    <button onclick="moveMask('down', 'mask2')">↓</button>
    <button onclick="moveMask('right', 'mask2')">→</button>
	</div>
  </div>
</div>

<div style="position: fixed; top: 10px; left: 10px; background: #f0f0f0; padding: 8px; border: 1px solid #ccc;">
  <strong>PID:</strong>
  <pre id="PID" style="margin: 0; font-family: monospace;"></pre>

<div style="position: fixed; top: 10px; left: 200px; background: #f0f0f0; padding: 8px; border: 1px solid #ccc;">
  <strong>DAY:</strong>
  <pre id="DAY" style="margin: 0; font-family: monospace;"></pre>
</div>

<script>
//window.onload = () => {
	const canvas = document.getElementById('reveal-canvas');
	console.log(canvas);
	const ctx = canvas.getContext('2d');
	const bgImage = new Image();
	bgImage.src = '../Spinda_Base_Top_Crop.png';

	const bounds = {
		mask1: { minX: 0, maxX: 150, minY: 0, maxY: 150 },
		mask2: { minX: 240, maxX: 390, minY: 10, maxY: 160 }
	};

	function drawBackground() {
	  ctx.clearRect(0, 0, canvas.width, canvas.height);
	  ctx.imageSmoothingEnabled = false;  // disable smoothing for pixelated look
	  ctx.imageSmoothingQuality = 'low';  // some browsers support this for explicit quality
	  ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
	}

	// Apply the white areas of a mask image to erase background
	function applyMask(maskImg) {
	  const x = parseInt(maskImg.style.left, 10);
	  const y = parseInt(maskImg.style.top, 10);
	  const tempCanvas = document.createElement('canvas');
	  tempCanvas.width = maskImg.width;
	  tempCanvas.height = maskImg.height;
	  const tempCtx = tempCanvas.getContext('2d');

	  // Draw the mask image to a temp canvas
	  tempCtx.drawImage(maskImg, 0, 0, maskImg.width, maskImg.height);
	  const maskData = tempCtx.getImageData(0, 0, maskImg.width, maskImg.height);

	  const bgData = ctx.getImageData(x, y, maskImg.width, maskImg.height);

	  for (let i = 0; i < maskData.data.length; i += 4) {
		const r = maskData.data[i];
		const g = maskData.data[i + 1];
		const b = maskData.data[i + 2];
		const a = maskData.data[i + 3];

		// If pixel is white enough, erase background
		if (r > 240 && g > 240 && b > 240 && a > 250) {
		  bgData.data[i + 3] = 0; // make transparent
		}
	  }

	  ctx.putImageData(bgData, x, y);
	  updateMaskPositions();
	}

	function makeDraggable(img, id) {
	  let isDragging = false;
	  let offsetX = 0, offsetY = 0;

	  const start = (e) => {
		isDragging = true;
		img.classList.add('dragging');
		const rect = img.getBoundingClientRect();
		const clientX = e.touches ? e.touches[0].clientX : e.clientX;
		const clientY = e.touches ? e.touches[0].clientY : e.clientY;
		offsetX = clientX - rect.left;
		offsetY = clientY - rect.top;
	  };

	  const move = (e) => {
		if (!isDragging) return;
		e.preventDefault();

		const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
		const clientX = e.touches ? e.touches[0].clientX : e.clientX;
		const clientY = e.touches ? e.touches[0].clientY : e.clientY;

		let x = clientX - containerRect.left - offsetX;
		let y = clientY - containerRect.top - offsetY;

		x = Math.round(x / 10) * 10;
		y = Math.round(y / 10) * 10;

		const b = bounds[id];
		x = Math.max(b.minX, Math.min(b.maxX, x));
		y = Math.max(b.minY, Math.min(b.maxY, y));

		img.style.left = `${x}px`;
		img.style.top = `${y}px`;

		drawBackground(); // redraw full bg before re-erasing
		applyMask(document.getElementById('mask1'));
		applyMask(document.getElementById('mask2'));
	  };

	  const end = () => {
		isDragging = false;
		img.classList.remove('dragging');
	  };

	  img.addEventListener('mousedown', start);
	  img.addEventListener('mousemove', move);
	  img.addEventListener('mouseup', end);
	  img.addEventListener('mouseleave', end);
	  img.addEventListener('touchstart', start, { passive: false });
	  img.addEventListener('touchmove', move, { passive: false });
	  img.addEventListener('touchend', end);
	}
	
	function moveMask(direction, ear) {
	  const selectedId = ear;
	  const mask = document.getElementById(selectedId);
	  const step = 10;

	  let left = parseInt(mask.style.left) || 0;
	  let top = parseInt(mask.style.top) || 0;

	  switch (direction) {
		case 'up': top -= step; break;
		case 'down': top += step; break;
		case 'left': left -= step; break;
		case 'right': left += step; break;
	  }
		console.log(bounds[ear].maxX)
		console.log(ear)
	  // Optional: clamp position inside boundaries
	  left = Math.max(bounds[ear].minX, Math.min(left, bounds[ear].maxX));
	  top = Math.max(bounds[ear].minY, Math.min(top, bounds[ear].maxY));

	  mask.style.left = `${left}px`;
	  mask.style.top = `${top}px`;

	  updateMaskPositions(); // update display if you're showing positions
	  redraw();              // optional: re-render canvas
	}
	function redraw() {
		drawBackground(); // redraw full bg before re-erasing
		applyMask(document.getElementById('mask1'));
		applyMask(document.getElementById('mask2'));
	}
	
    function updateMaskPositions() {
	  const masks = document.querySelectorAll('.mask-img');
	  var PID1 = Math.round(masks[0].offsetTop/10).toString(16).toUpperCase();
	  PID1 = PID1 + Math.round(masks[0].offsetLeft/10).toString(16).toUpperCase();
	  
	  var PID2 = Math.round(masks[1].offsetTop/10-1).toString(16).toUpperCase();
	  PID2 = PID2 + Math.round(masks[1].offsetLeft/10-24).toString(16).toUpperCase();
	  console.log(PID1.toString(16));
	  console.log(PID2.toString(16));
	  var PID = PID2 + PID1;
	  //let output = 'PID: ' + PID + '\n';
	  //output += `Left Spot: x=${Math.round(masks[0].offsetLeft/10)}, y=${Math.round(masks[0].offsetTop/10)}\n`;
	  //output += `Right Spot: x=${Math.round(masks[1].offsetLeft/10-24)}, y=${Math.round(masks[1].offsetTop/10-1)}\n`;
	  //document.getElementById('mask-positions').textContent = output;
	  var g = "Female";
	  console.log(parseInt(PID.slice(-2), 16));
	  if (parseInt(PID.slice(-2), 16) >= 127){
        g = "Male";
	  }
	  document.getElementById('PID').textContent = PID + "\nGender: " + g;
	  getDay(PID);
    }
	function getDay(PID) {
		fetch('../All_MirageBytes.txt')
        .then(res => {
          if (!res.ok) throw new Error('Failed to fetch .txt');
          return res.text();
        })
        .then(data => {
          const lines = data.trim().split(/\r?\n/);
          const matchingLines = [];

          for (const line of lines) {
            const [index, hex] = line.trim().split(/\s+/);
            if (!hex) continue;
            const last4 = hex.slice(-4).toUpperCase();

            if (PID.includes(last4)) {
              matchingLines.push(`${index}: ${hex}`);
            }
          }

          document.getElementById('DAY').textContent = 
            matchingLines.length > 0 
              ? matchingLines.join('\n') 
              : 'No matches found.';
        })
        .catch(err => {
          document.getElementById('DAY').textContent = 'Error: ' + err.message;
        });
    }
				
	bgImage.onload = () => {
	  makeDraggable(document.getElementById('mask1'), 'mask1');
	  makeDraggable(document.getElementById('mask2'), 'mask2');
	  redraw();
	};
//};
</script>
</script>

</body>
</html>
